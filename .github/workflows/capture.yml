name: Verify portfolio portrait intro
on:
  push:
    branches: [portfolio-project-captures]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the published portrait on desktop and mobile
        run: |
          python -m pip install selenium
          python - <<'PY'
          import os, time, urllib.request
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          os.mkdir('proof')
          url='https://vikas-hy-portfolio.vercel.app/'
          for attempt in range(24):
              if 'vikas-portrait.webp' in urllib.request.urlopen(url,timeout=12).read().decode(): break
              time.sleep(3)
          cfg=webdriver.ChromeOptions()
          cfg.add_argument('--headless=new')
          cfg.add_argument('--window-size=1440,1000')
          with webdriver.Chrome(options=cfg) as b:
              wait=WebDriverWait(b,15)
              for width in (1440,390,320):
                  b.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',dict(width=width,height=844,deviceScaleFactor=1,mobile=width<500))
                  if width==390:
                      b.get('https://demo.codeandchill.store/portfolio/')
                      wait.until(lambda d:d.find_elements(By.CSS_SELECTOR,'h1'))
                      b.save_screenshot('proof/reference-mobile.png')
                  b.get(url)
                  assert b.find_element(By.CSS_SELECTOR,'h1').get_attribute('aria-label')=='Vikas H Y — Portfolio'
                  assert not b.find_elements(By.CSS_SELECTOR,'.study, .controls, .particles')
                  assert b.execute_script('return document.documentElement.scrollWidth <= window.innerWidth')
                  wait.until(lambda d:d.execute_script("return document.querySelector('.hero-image img').style.opacity==='0'"))
                  canvas=b.find_element(By.CSS_SELECTOR,'.hero-image canvas')
                  frame=lambda:b.execute_script('return arguments[0].toDataURL()',canvas)
                  before=frame()
                  ActionChains(b).move_to_element(canvas).perform()
                  wait.until(lambda d:frame()!=before)
                  b.execute_script('window.scrollTo(0,140)')
                  wait.until(lambda d:frame()!=before)
                  b.execute_script('window.scrollTo(0,0)')
                  time.sleep(.25)
                  if width!=320: b.save_screenshot('proof/'+('desktop' if width==1440 else 'mobile')+'.png')
                  if width<500:
                      menu=b.find_element(By.CSS_SELECTOR,'button[aria-label="Open menu"]');menu.click()
                      assert menu.get_attribute('aria-expanded')=='true'
                      menu.send_keys(Keys.ESCAPE)
                      assert menu.get_attribute('aria-expanded')=='false'
                  b.find_element(By.LINK_TEXT,'View Projects').click()
                  assert b.current_url.endswith('#projects')
                  assert len(b.find_elements(By.CSS_SELECTOR,'.work'))==4
              b.execute_cdp_cmd('Emulation.setEmulatedMedia',{'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
              b.get(url)
              assert b.execute_script("return document.querySelector('.hero-letter').getAnimations().length===0")
              assert b.execute_script("return getComputedStyle(document.querySelector('.hero-image img')).opacity==='1'")
              cv=b.find_element(By.CSS_SELECTOR,'a[download]').get_attribute('href')
              assert urllib.request.urlopen(cv).read(5)==b'%PDF-'
              print('Desktop and mobile motion, reduced motion, layout, projects, and resume passed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-qa
          path: proof
          retention-days: 1
